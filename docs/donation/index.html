<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>支持作者 · NBA Live Score</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #f0f6ff 0%, #e8f0fe 100%);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; color: #1f2937;
  }
  .card {
    background: #fff; border-radius: 20px; padding: 40px 36px 32px;
    max-width: 440px; width: 100%; text-align: center;
    box-shadow: 0 12px 40px rgba(37, 99, 235, .12);
  }
  h1 { font-size: 24px; margin-bottom: 8px; }
  .sub { color: #6b7280; font-size: 14px; line-height: 1.7; margin-bottom: 24px; }
  .qrcode {
    width: 260px; max-width: 80%; border-radius: 12px;
    border: 1px solid #eef2f7; padding: 8px;
  }
  .hint { margin-top: 14px; color: #1677ff; font-size: 15px; font-weight: 600; }
  .btn {
    display: inline-block; margin-top: 22px; background: #1677ff; color: #fff;
    text-decoration: none; padding: 12px 32px; border-radius: 999px;
    font-size: 16px; font-weight: 600;
    box-shadow: 0 6px 16px rgba(22, 119, 255, .3);
  }
  .btn:active { transform: scale(.98); }
  .note {
    margin-top: 26px; padding-top: 18px; border-top: 1px dashed #e5e7eb;
    color: #9ca3af; font-size: 12.5px; line-height: 1.8;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>💙 支持作者</h1>
    <p class="sub">如果 <b>NBA Live Score</b> 帮你省去了切浏览器看比分的时间，<br>欢迎请作者喝杯咖啡 ☕</p>

    <img class="qrcode" src="alipay-qrcode.png" alt="支付宝收款码">
    <div class="hint">打开支付宝「扫一扫」扫码</div>

    <a class="btn" href="https://qr.alipay.com/tsx15620myb6nnchjaghnbd">
      📱 手机上点此直接转账
    </a>

    <p class="note">
      捐赠完全自愿，与插件功能无关，插件永久免费、持续更新，感谢支持 🙏<br>
      Donations are voluntary and never required. Thank you!
    </p>
  </div>
</body>
</html>
